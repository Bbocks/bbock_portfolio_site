# Cloudflare Workers — static assets (`npx wrangler deploy` after `npm run build`).
# Set `name` to match your Worker. If you use Cloudflare Pages (Git) only, you can
# delete this file: removing `public/_redirects` fixes the loop warning, and Pages
# serves SPAs without that file when no root `404.html` is present.
name = "bbock-portfolio"
compatibility_date = "2026-04-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
